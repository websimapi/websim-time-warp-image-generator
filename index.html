<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Warp Image Generator</title>
    
    <!-- React and Babel for JSX -->
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    
    <script type="importmap">
      {
        "imports": {}
      }
    </script>
    
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --background-color: #f8f9fa;
            --surface-color: #ffffff;
            --text-color: #212529;
            --border-color: #dee2e6;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        #root {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        h1, h2, h3 {
            color: var(--text-color);
            margin: 0 0 15px 0;
        }
        
        h1 {
            text-align: center;
            font-size: 2.5rem;
        }

        .sub-header {
            text-align: center;
            font-size: 1.2rem;
            color: var(--secondary-color);
            margin-top: -10px;
            margin-bottom: 30px;
            font-style: italic;
        }

        .card {
            background-color: var(--surface-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            font-weight: 500;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            background-color: #0056b3;
            transform: translateY(-1px);
        }

        .btn-primary.btn-large {
            padding: 15px 30px;
            font-size: 1.2rem;
            width: 80%;
            max-width: 300px;
        }

        .btn:disabled {
            background-color: var(--secondary-color);
            opacity: 0.65;
            cursor: not-allowed;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .gallery-item {
            position: relative;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            border: 3px solid transparent;
            transition: all 0.2s ease-in-out;
            box-shadow: var(--shadow);
        }
        
        .gallery-item:hover {
            transform: scale(1.05);
            border-color: var(--primary-color);
        }
        
        .gallery-item.selected {
            border-color: var(--success-color);
            transform: scale(1.05);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .generator-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: center;
        }
        
        @media (max-width: 800px) {
            .generator-container {
                grid-template-columns: 1fr;
            }
        }

        .image-display {
            width: 100%;
            max-width: 512px;
            margin: 0 auto;
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            background-color: var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        .image-display img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .placeholder-text {
            color: var(--secondary-color);
            text-align: center;
            padding: 20px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .slider-container {
            width: 100%;
            text-align: center;
        }
        
        input[type="range"] {
            width: 90%;
            cursor: pointer;
        }
        
        #time-label {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 10px;
            min-height: 2rem;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 10px;
        }
        
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: var(--primary-color);
            animation: spin 1s ease infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .results-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        
        @media (max-width: 800px) {
            .results-container {
                grid-template-columns: 1fr;
            }
        }
        
        .result-image-display {
            width: 100%;
            aspect-ratio: 1/1;
        }
        
        .result-text {
            background-color: var(--background-color);
            padding: 15px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
        }
        
        .result-text h4 {
            margin-top: 0;
        }
        
        .result-text p {
            font-style: italic;
            color: var(--secondary-color);
        }
        
        .result-text .btn {
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" src="script.js"></script>

</html>
